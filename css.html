<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS</title>
    <link rel="stylesheet" href="style.css" />

    <style>


/* internal CSS */
      *,
      body,
      html {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
      }

      h1 {
        color: red;
      }

      .title {
        color: green;
      }

      #description {
        color: blue;
      }
      /* pseudo Selector */
      .title:hover {
        color: chocolate;
      }
    </style>
  </head>
  <body>
    <h1>CSS</h1>
    <p>Cascading Style Sheet</p>
    <h1>CSS Selectors</h1>

    Element Selector Class Selector

    <h1 class="title">Title</h1>

    <h1 class="title">Title 1</h1>

    <h2 id="description">Description</h2>

    <div>
        <!-- //inline CSS -->
      <p style="color: red;" >Testing</p>
    </div>

    <div class="box"></div>
  </body>
</html>
